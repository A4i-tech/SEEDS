name: Promotion PR

on:
  push:
    branches: [a4i/staging]
  workflow_dispatch:

concurrency:
  group: promote-pr
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROMOTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.PROMOTIONS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}
            .github
          permission-contents: read
          permission-pull-requests: write
          permission-issues: read
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Open or refresh the staging -> main promotion PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          git fetch origin a4i/main
          number=$(gh pr list --base a4i/main --head a4i/staging --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)][0].number')
          pr_numbers=$(git log --format=%s origin/a4i/main..origin/a4i/staging | sed -nE 's/^Merge pull request #([0-9]+) from .*|.*\(#([0-9]+)\)$/\1\2/p')
          issues=$(
            for pr in $pr_numbers; do
              gh api graphql -F number="$pr" -f query='
                query($number: Int!) {
                  repository(owner: "${{ github.repository_owner }}", name: "${{ github.event.repository.name }}") {
                    pullRequest(number: $number) {
                      closingIssuesReferences(first: 10) { nodes { url } }
                    }
                  }
                }' --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].url'
            done | sort -u
          )
          version="$(date +%Y.%m.%d)"
          if [ -z "$issues" ]; then
            body="## Release $version"$'\n\n'"No linked issues in this release."
          else
            body="## Release $version"$'\n\n'"$(printf '%s\n' "$issues" | sed 's/^/- /')"
          fi
          created=false
          if [ -z "$number" ]; then
            created=true
            url=$(gh pr create --base a4i/main --head a4i/staging \
              --title "Release: a4i/staging -> a4i/main" \
              --body "$body" --label release)
            number=$(gh pr view "$url" --json number --jq .number)
          else
            gh pr edit "$number" --body "$body"
          fi
          if [ -z "$number" ]; then
            echo "Could not determine promotion PR number." >&2
            exit 1
          fi
          gh pr merge "$number" --auto --merge
          if [ "$created" = true ]; then
            pr_url=$(gh pr view "$number" --json url --jq .url)
            jq -nc --arg text "Release PR ready for review: $pr_url" '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.5",
                  msteams: {width: "Full"},
                  body: [{type: "TextBlock", text: $text, wrap: true}]
                }
              }]
            }' | curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL" || echo "Webhook notification failed, not failing the run for it." >&2
          fi
