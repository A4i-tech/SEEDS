name: Teacher WebApp E2E

on:
  workflow_call:
    inputs:
      e2e_instance:
        description: "E2E_INSTANCE to run against"
        type: string
        default: dev
  workflow_dispatch:
    inputs:
      e2e_instance:
        description: "E2E_INSTANCE to run against (local is omitted; it isn't reachable from a GitHub-hosted runner)"
        type: choice
        options:
          - dev
        default: dev

permissions:
  contents: read

concurrency:
  group: teacher-webapp-e2e-${{ github.ref }}-${{ github.event_name }}-${{ inputs.e2e_instance }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Teacher WebApp E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: teacher-webapp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for this commit's build to be live
        if: github.event_name != 'workflow_dispatch'
        timeout-minutes: 17
        env:
          IMAGE: ghcr.io/a4i-tech/seeds/teacher-webapp:staging-${{ github.sha }}
          URL: https://teacher-webapp-dev.a4i-lab.in/
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          docker run --rm --entrypoint cat "$IMAGE" /usr/share/nginx/html/index.html > "$tmp/expected.html"
          test -s "$tmp/expected.html" || { echo "::error::$IMAGE has no index.html"; exit 1; }
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS --max-time 10 -H 'Cache-Control: no-cache' -o "$tmp/live.html" "$URL" &&
              cmp -s "$tmp/live.html" "$tmp/expected.html"; then
              echo "$URL is serving staging-$GITHUB_SHA"
              exit 0
            fi
            sleep 15
          done
          echo "::error::$URL did not serve staging-$GITHUB_SHA within 15 minutes"
          exit 1

      - name: Run Playwright E2E tests
        env:
          E2E_INSTANCE: ${{ inputs.e2e_instance }}
          E2E_TEACHER_PHONE: ${{ secrets.E2E_TEACHER_PHONE }}
          E2E_TEACHER_PASSWORD: ${{ secrets.E2E_TEACHER_PASSWORD }}
        run: npm run test:e2e

      - name: Verify tests actually ran
        if: always()
        run: |
          node -e "
            const r = require('./e2e-results.json');
            const tests = [];
            const walk = (s) => { (s.specs || []).forEach((sp) => tests.push(...sp.tests)); (s.suites || []).forEach(walk); };
            r.suites.forEach(walk);
            const ran = tests.filter((t) => t.projectName === 'chromium-teacher-authenticated' && t.status !== 'skipped').length;
            if (!ran) { console.error('No authenticated tests ran.'); process.exit(1); }
          "

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-webapp-playwright-report
          path: teacher-webapp/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-webapp-test-results
          path: teacher-webapp/test-results/
          retention-days: 14
