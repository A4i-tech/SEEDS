name: Ancestry Watch

on:
  push:
    branches: [a4i/main, a4i/staging]
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: ancestry-watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a scoped App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.PROMOTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.PROMOTIONS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-administration: read
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm a4i/main's own merge rule hasn't been loosened
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RULESET_ID: ${{ vars.MAIN_RULESET_ID }}
        run: |
          bypass=$(gh api "repos/${{ github.repository }}/rulesets/$RULESET_ID" --jq 'if .bypass_actors == null then "missing" else (.bypass_actors | length | tostring) end')
          methods=$(gh api "repos/${{ github.repository }}/rulesets/$RULESET_ID" --jq '[.rules[] | select(.type=="pull_request") | .parameters.allowed_merge_methods[]] | sort | join(",")')
          if [ "$bypass" = "missing" ]; then
            echo "Could not read bypass_actors, the App token likely lacks Administration:read on the ruleset." >&2
            exit 1
          fi
          if [ "$bypass" != "0" ]; then
            echo "a4i/main ruleset bypass_actors is non-empty." >&2
            exit 1
          fi
          if [ "$methods" != "merge" ]; then
            echo "a4i/main ruleset allows merge methods beyond merge-commit: $methods" >&2
            exit 1
          fi
      - name: Confirm commits unique to main are all merge commits (no squash/rebase/direct push)
        if: ${{ !cancelled() }}
        env:
          BASELINE: ${{ vars.ANCESTRY_WATCH_BASELINE }}
        run: |
          git fetch origin a4i/main
          if ! git merge-base --is-ancestor "$BASELINE" origin/a4i/main; then
            echo "ANCESTRY_WATCH_BASELINE ($BASELINE) is unset, invalid, or not an ancestor of a4i/main." >&2
            exit 1
          fi
          bad=$(git rev-list --first-parent --no-merges "$BASELINE..origin/a4i/main")
          if [ -n "$bad" ]; then
            echo "Non-merge commit(s) found on a4i/main's first-parent chain: $bad" >&2
            exit 1
          fi
      - name: Notify Teams on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          jq -nc --arg text "Ancestry watch is failing. Run: $run_url" '{
            type: "message",
            attachments: [{
              contentType: "application/vnd.microsoft.card.adaptive",
              content: {
                "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                type: "AdaptiveCard",
                version: "1.5",
                msteams: {width: "Full"},
                body: [{type: "TextBlock", text: $text, wrap: true}]
              }
            }]
          }' | curl --fail-with-body -sS -X POST -H 'Content-Type: application/json' -d @- "$WEBHOOK_URL"
