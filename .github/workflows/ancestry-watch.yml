name: Ancestry Watch

on:
  push:
    branches: [a4i/main, a4i/staging]
  schedule:
    - cron: "0 * * * *"

concurrency:
  group: ancestry-watch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm a4i/main's own merge rule hasn't been loosened
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
          RULESET_ID: ${{ vars.MAIN_RULESET_ID }}
        run: |
          bypass=$(gh api "repos/${{ github.repository }}/rulesets/$RULESET_ID" --jq 'if .bypass_actors == null then "missing" else (.bypass_actors | length | tostring) end')
          methods=$(gh api "repos/${{ github.repository }}/rulesets/$RULESET_ID" --jq '[.rules[] | select(.type=="pull_request") | .parameters.allowed_merge_methods[]] | sort | join(",")')
          if [ "$bypass" = "missing" ]; then
            echo "Could not read bypass_actors, RELEASE_BOT_PAT likely lacks Administration:read on the ruleset." >&2
            exit 1
          fi
          if [ "$bypass" != "0" ]; then
            echo "a4i/main ruleset bypass_actors is non-empty." >&2
            exit 1
          fi
          if [ "$methods" != "merge" ]; then
            echo "a4i/main ruleset allows merge methods beyond merge-commit: $methods" >&2
            exit 1
          fi
      - name: Confirm commits unique to main are all merge commits (no squash/rebase/direct push)
        if: ${{ !cancelled() }}
        env:
          BASELINE: ${{ vars.ANCESTRY_WATCH_BASELINE }}
        run: |
          git fetch origin a4i/main
          if ! git merge-base --is-ancestor "$BASELINE" origin/a4i/main; then
            echo "ANCESTRY_WATCH_BASELINE ($BASELINE) is unset, invalid, or not an ancestor of a4i/main." >&2
            exit 1
          fi
          bad=$(git rev-list --first-parent --no-merges "$BASELINE..origin/a4i/main")
          if [ -n "$bad" ]; then
            echo "Non-merge commit(s) found on a4i/main's first-parent chain: $bad" >&2
            exit 1
          fi
      - name: File or update an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.RELEASE_BOT_PAT }}
        run: |
          title="Ancestry watch is failing"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          number=$(gh issue list --state open --search "in:title $title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $run_url"
          else
            gh issue create --title "$title" --body "Run: $run_url"
          fi
