name: ContentWebApp E2E

on:
  workflow_call:
    inputs:
      e2e_instance:
        description: "E2E_INSTANCE to run against"
        type: string
        default: dev
  workflow_dispatch:
    inputs:
      e2e_instance:
        description: "E2E_INSTANCE to run against (local is not reachable from a GitHub-hosted runner, so it is not offered here)"
        type: choice
        options:
          - onrender
          - dev
        default: dev

concurrency:
  group: contentwebapp-e2e-${{ github.ref }}-${{ github.event_name }}-${{ inputs.e2e_instance }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ContentWebApp E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ContentWebApp
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        env:
          TARGET_INSTANCE: ${{ inputs.e2e_instance }}
        run: npm run "test:e2e:$TARGET_INSTANCE"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ContentWebApp/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ContentWebApp/test-results/
          retention-days: 14
