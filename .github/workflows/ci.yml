name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload_coverage:
        description: "Upload coverage results to gist"
        type: boolean
        required: true
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.service.name }}, ${{ matrix.service.context }}, ${{ matrix.service.lang }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: platform
            context: platform
            lang: python
            coverage_threshold: "80"

          - name: content-webapp
            context: ContentWebApp
            lang: node
            node_version: "22"

          - name: teacher-webapp
            context: teacher-webapp
            lang: node
            node_version: "20"

          - name: websocket-service
            context: websocket-service
            lang: node
            node_version: "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up (Poetry)
        if: matrix.service.lang == 'python'
        uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.12"
          directory: ${{ matrix.service.context }}

      - name: Set up (Node.js)
        if: matrix.service.lang == 'node'
        uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.service.node_version }}
          directory: ${{ matrix.service.context }}

      - name: Lint (Python)
        if: matrix.service.lang == 'python'
        uses: ./.github/actions/run-python-lint
        with:
          directory: ${{ matrix.service.context }}

      - name: Lint (Node.js)
        if: matrix.service.lang == 'node'
        uses: ./.github/actions/run-node-lint
        with:
          directory: ${{ matrix.service.context }}

      - name: Test (Python)
        if: matrix.service.lang == 'python'
        uses: ./.github/actions/run-python-tests
        with:
          directory: ${{ matrix.service.context }}
          coverage_threshold: ${{ matrix.service.coverage_threshold }}

      - name: Test (Node.js)
        if: matrix.service.lang == 'node'
        uses: ./.github/actions/run-node-tests
        with:
          directory: ${{ matrix.service.context }}

      - name: Extract coverage (Python)
        if: matrix.service.lang == 'python' && inputs.upload_coverage
        uses: ./.github/actions/extract-coverage-python
        with:
          coverage_gist_token: ${{ secrets.COVERAGE_GIST_TOKEN }}
          coverage_gist_id: ${{ vars.COVERAGE_GIST_ID }}
          directory: ${{ matrix.service.context }}

      - name: Extract coverage (Node.js)
        if: matrix.service.lang == 'node' && inputs.upload_coverage
        uses: ./.github/actions/extract-coverage-node
        with:
          coverage_gist_token: ${{ secrets.COVERAGE_GIST_TOKEN }}
          coverage_gist_id: ${{ vars.COVERAGE_GIST_ID }}
          directory: ${{ matrix.service.context }}

  image-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [ContentWebApp, teacher-webapp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t app ${{ matrix.context }}

      - name: Container exits at start when config is missing
        run: |
          if docker run --rm app; then echo "container started without config"; exit 1; fi

      - name: Container serves env.js from env vars
        run: |
          set -euo pipefail
          envs="-e REACT_APP_API_BASE_URL=ci-marker -e REACT_APP_STORAGE_ACCOUNT_NAME=ci-marker -e REACT_APP_GOOGLE_SITE_VERIFICATION=ci-marker"
          CID=$(docker run -d -p 8080:8080 $envs app)
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors localhost:8080/env.js | grep -q "REACT_APP_API_BASE_URL:'ci-marker'" || { docker logs "$CID"; exit 1; }
          curl -sI localhost:8080/env.js | grep -qi "^cache-control: no-store"
          ! docker exec "$CID" grep -rq ci-marker /usr/share/nginx/html
