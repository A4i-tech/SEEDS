name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      upload_coverage:
        description: "Upload coverage results to gist"
        type: boolean
        required: true
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: platform
            context: platform
            lang: python

          - name: content-webapp
            context: ContentWebApp
            lang: node

          - name: teacher-webapp
            context: teacher-webapp
            lang: node

          - name: websocket-service
            context: websocket-service
            lang: node

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up (Poetry)
        if: matrix.service.lang == 'python'
        uses: ./.github/actions/setup-poetry
        with:
          python-version: "3.12"
          directory: ${{ matrix.service.context }}

      - name: Set up (Node.js)
        if: matrix.service.lang == 'node'
        uses: ./.github/actions/setup-node
        with:
          node-version: "20"
          directory: ${{ matrix.service.context }}

      - name: Lint (Python)
        if: matrix.service.lang == 'python'
        uses: ./.github/actions/run-python-lint
        with:
          directory: ${{ matrix.service.context }}

      - name: Lint (Node.js)
        if: matrix.service.lang == 'node'
        uses: ./.github/actions/run-node-lint
        with:
          directory: ${{ matrix.service.context }}

      - name: Test (Python)
        if: matrix.service.lang == 'python'
        uses: ./.github/actions/run-python-tests
        with:
          directory: ${{ matrix.service.context }}

      - name: Test (Node.js)
        if: matrix.service.lang == 'node'
        uses: ./.github/actions/run-node-tests
        with:
          directory: ${{ matrix.service.context }}

      - name: Extract coverage (Python)
        if: matrix.service.lang == 'python' && inputs.upload_coverage
        uses: ./.github/actions/extract-coverage-python
        with:
          coverage_gist_token: ${{ secrets.COVERAGE_GIST_TOKEN }}
          coverage_gist_id: ${{ vars.COVERAGE_GIST_ID }}
          directory: ${{ matrix.service.context }}

      - name: Extract coverage (Node.js)
        if: matrix.service.lang == 'node' && inputs.upload_coverage
        uses: ./.github/actions/extract-coverage-node
        with:
          coverage_gist_token: ${{ secrets.COVERAGE_GIST_TOKEN }}
          coverage_gist_id: ${{ vars.COVERAGE_GIST_ID }}
          directory: ${{ matrix.service.context }}

  image-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context: [ContentWebApp, teacher-webapp]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test runtime-env.sh
        run: sh .github/scripts/test-runtime-env.sh ${{ matrix.context }}

      - name: Build image
        run: docker build -t app ${{ matrix.context }}

      - name: Image takes its config at start
        run: |
          set -euo pipefail
          vars=$(sed -n 's/^VARS="\(.*\)"$//p' ${{ matrix.context }}/runtime-env.sh)
          envs=""
          for v in $vars; do envs="$envs -e $v=ci-marker-$v"; done
          if docker run --rm app; then echo "container started without config"; exit 1; fi
          CID=$(docker run -d -p 8080:8080 $envs app)
          curl -fsS --retry 10 --retry-delay 1 --retry-all-errors -o /dev/null localhost:8080/ || { docker logs "$CID"; exit 1; }
          docker exec "$CID" sh -c "grep -rq ci-marker-REACT_APP_API_BASE_URL /usr/share/nginx/html"
          ! docker exec "$CID" sh -c "grep -rq __REACT_APP /usr/share/nginx/html"
