name: Main Guards

on:
  pull_request:
    branches: [a4i/main]

jobs:
  source-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Only staging or hotfix branches, from this repo, may target main
        env:
          REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "PRs into a4i/main must come from this repository, not a fork ($HEAD_REPO)." >&2
            exit 1
          fi
          case "$REF" in
            a4i/staging|hotfix/*) exit 0 ;;
            *) echo "PRs into a4i/main must come from a4i/staging or hotfix/*, got: $REF" >&2; exit 1 ;;
          esac

  ancestry-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block any merge into main until a pending hotfix is synced back to staging
        run: |
          git fetch origin a4i/staging a4i/main
          pending=$(git rev-list --no-merges origin/a4i/staging..origin/a4i/main)
          if [ -z "$pending" ]; then
            exit 0
          fi
          echo "a4i/main has commits not yet reflected on a4i/staging: $pending" >&2
          echo "Merge the pending back-sync PR first." >&2
          exit 1
