name: Semgrep

on:
  pull_request:
    branches: [a4i/staging]

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --quiet semgrep==1.179.0

      - name: Semgrep diff scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --baseline-commit "$BASE_SHA" \
            --severity ERROR \
            --error \
            --sarif --output semgrep.sarif \
            --metrics off \
            --oss-only

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Semgrep full-repo scan (advisory, not gating)
        if: always()
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --severity ERROR \
            --severity WARNING \
            --json --output semgrep-full.json \
            --metrics off \
            --oss-only

          {
            echo "## Semgrep full-repo findings (advisory, pre-existing code, does not gate this PR)"
            echo
            echo '```'
            jq -r '
              .results
              | group_by(.check_id + "|" + .extra.severity)
              | map({count: length, severity: .[0].extra.severity, rule: .[0].check_id})
              | sort_by(-.count)
              | (["COUNT","SEVERITY","RULE"], (.[] | [.count, .severity, .rule]))
              | @tsv
            ' semgrep-full.json | column -t -s $'\t'
            echo '```'
            echo
            echo "### Detail (file:line)"
            echo
            echo '```'
            jq -r '
              .results
              | sort_by(.extra.severity, .path, .start.line)
              | (["SEVERITY","RULE","FILE","LINE"], (.[] | [.extra.severity, .check_id, .path, .start.line]))
              | @tsv
            ' semgrep-full.json | column -t -s $'\t'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload full-repo findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-full-report
          path: semgrep-full.json
