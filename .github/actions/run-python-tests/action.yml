name: Run Python Tests
description: Run tests for a Python project
inputs:
  directory:
    description: "Directory of the Python project"
    required: true
  coverage_threshold:
    description: "Optional minimum total coverage percentage required (fails the build below this, via pytest-cov --cov-fail-under)"
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run tests with coverage
      env:
        COVERAGE_THRESHOLD_INPUT: ${{ inputs.coverage_threshold }}
      run: |
        cd ${{ inputs.directory }}
        FAIL_UNDER=""
        if [ -n "$COVERAGE_THRESHOLD_INPUT" ]; then
          FAIL_UNDER="--cov-fail-under=$COVERAGE_THRESHOLD_INPUT"
        fi
        poetry run pytest --ignore=tests/e2e --cov=app --cov-report=html --cov-report=xml --cov-report=json --cov-report=term $FAIL_UNDER
      shell: bash
