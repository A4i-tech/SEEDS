title = "SEEDS gitleaks allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "dummy secret reused across platform test files"
regexTarget = "match"
regexes = [
  '''test-secret-key-for-integration-tests-32ch''',
]

[[allowlists]]
description = "VONAGE_CONFERENCE_APPLICATION_PRIVATE_KEY64 .env.example placeholder, key has no assigned value, generic-api-key fires on the variable name's entropy (match spans into the next line's key name), not a secret"
regexTarget = "match"
regexes = [
  '''\AVONAGE_CONFERENCE_APPLICATION_PRIVATE_KEY64=\nVONAGE_IVR_APPLICATION_ID=\z''',
]

[[allowlists]]
description = "dummy Fernet key for WEBHOOK_SECRET_ENCRYPTION_KEY in platform/tests/conftest.py"
regexTarget = "match"
regexes = [
  '''Bx3v9fJf5vD8m3sV7bqL4kQe2wZzXr1yT6nC0pA8dEo=''',
]
