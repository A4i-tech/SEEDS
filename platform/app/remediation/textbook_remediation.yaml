pipeline_id: textbook_remediation
domain_profile: accessibility
input_modality: document
description: "Remediate a scanned textbook into an accessible block tree with alt text, MathML, and review flags"

parameters:
  properties:
    language:
      type: string
      description: "Language of the body text"
      default: "auto"
    ocr_engine:
      type: string
      description: "OCR engine name"
      default: "azure_mistral"
    verify_model:
      type: string
      description: "Chat model used for OCR verification and remediation"
      default: "azure-responses:gpt-4.1-mini"
    page_concurrency:
      type: integer
      minimum: 1
      description: "Pages remediated at the same time"
      default: 4

steps:
  - agent: page_chunking
    description: "Split the book into single-page PDFs"
    config:
      mode: pdf

  - agent: ocr
    description: "Read page text with the configured OCR model"
    config:
      engine: ${.config.ocr_engine}
      src_lang: ${.config.language}
      foreach: '.items[] | select(.metadata.kind != "image")'
      extract_images: true
      image_min_size: 40
      extract_header_footer: true
      deduplicate: true

  - agent: transform
    description: "Rebuild page items so OCR figure payloads leave the content metadata"
    config:
      update: [items]
      value: "."

  - agent: transform
    description: "Remove print-artifact lines from OCR text"
    config:
      update: [items]
      value: |
        .items |= map(
          if (.text | type) == "string" then
            .text |= (
              split("\n")
              # Drop a chapter code line (40 chars or fewer), a Reprint line, or an .indd marker line (80 chars or fewer).
              | map(select(((test("\\b\\d{4}CH\\d{2}\\b") and length <= 40) or test("^\\s*Reprint\\s+\\d{4}-\\d{2}\\s*$") or (test("\\.indd") and length <= 80)) | not))
              | join("\n")
            )
          else . end
        )

  - agent: safe_extract
    description: "Verify OCR text against the page image"
    config:
      foreach: '.items[] | select(.metadata.kind != "image")'
      input: "[.id]"
      context: ".text"
      path: ".metadata.verified"
      model: ${.config.verify_model}
      concurrency: ${.config.page_concurrency}
      retries: 3
      prompt: |
        You are given a textbook page as an image, and the Markdown that an OCR
        engine produced from that same page. Return corrected Markdown.

        The image is the truth. Change the text only where the image disagrees
        with it. Do not rewrite, summarise, translate, or reorder anything.
        Keep the reading order the image shows.

        When the page image is not attached, the OCR Markdown is your only source:
        fix only character and word errors inside it, and never add a sentence it
        does not contain. A cover page, title page, or a page that is mostly a
        picture is valid input. When the Markdown holds only <image .../> markers
        and no text, return it unchanged. Never invent a subject, chapter, or
        passage.

        Verify the text against the image by checking for these general classes of faults:

        Script and orthography:
        - Wrong or visually confused consonants, ligatures, or compound characters.
        - Dropped, substituted, or hallucinated vowel signs (matras), modifiers (such as anusvara, nukta, reph, virama/halant), or half-consonants.
        - Text in a script or alphabet the page does not use. Discard hallucinated foreign script and flag the page.
        - Compound words incorrectly split or fragmented across character boundaries.

        Numbers, quantities, and units:
        - Digits confused with visually similar letters (e.g., numeral 0 vs letter O).
        - Fractions or exponents flattened, distorted, or erroneously converted into native numerals.
        - Digits written in a different digit script than the image prints. Copy each digit in
          the script the image shows. A Bengali page that prints "অধ্যায় 1" keeps the Western
          digit 1.
        - Corrupted physical units or invalid word spacing between numbers and units (e.g., unintended merging that alters the physical quantity).
        - Non-standard numeral grouping or misplaced delimiters within numbers.

        Scientific and chemical notation:
        - Dropped brackets, parentheses, polyatomic groups, or stoichiometric coefficients.
        - Chemical formulas missing sub/superscripts or collapsed into flat text.
        - Unintended merging of adjacent formulas, reactants, or products into a single string.
        - Preserving exact qualifiers (such as physical states, concentrations, or reaction conditions) without guessing.

        Markup and formatting:
        - Raw LaTeX commands that lost leading backslashes or contain malformed command names.
        - Extraneous Markdown tokens (e.g., stray hashes, orphaned bold/italic asterisks) leaked into body text.
        - MathML or raw XML tags improperly injected into running prose.

        Layout and text flow:
        - Words inappropriately hyphenated or broken across line wraps; join them cleanly.
        - Distinct headings merged into paragraph text, or separated paragraphs unintentionally glued together.
        - Table structures that lost cell contents or misaligned headers and columns.

        Record every change you make in corrections. Set certain to false when
        the print is too faint to settle the reading, and set review_needed on
        the page when anything remains uncertain. Never guess a chemical name.
      schema:
        type: object
        properties:
          markdown:
            type: string
            description: "The corrected Markdown for this page, in reading order"
          corrections:
            type: array
            items:
              type: object
              properties:
                found: {type: string}
                corrected: {type: string}
                fault:
                  type: string
                  enum: [consonant, vowel_sign, anusvara, reph, half_consonant,
                         compound_word, wrong_script, digit_letter, fraction, unit,
                         number_format, chemical_group, subscript, merged_formula,
                         latex_escape, markdown_artifact, mathml_in_prose,
                         split_word, merged_heading, other]
                certain: {type: boolean}
              required: [found, corrected, fault, certain]
          confidence: {type: number, minimum: 0, maximum: 1}
          review_needed: {type: boolean}
          review_reason: {type: string}
        required: [markdown, corrections, confidence, review_needed, review_reason]
      assertions:
        - expr: '(.markdown | length) > 0'
          feedback: "markdown is empty. Return the page text, corrected where the image disagrees with the OCR."
        - expr: '[.corrections[] | select(.found == .corrected)] | length == 0'
          feedback: "A correction has found equal to corrected. Remove it, it is not a change."

  - agent: transform
    description: "Restore Western digits the OCR verification turned into Bengali digits"
    config:
      update: [items]
      value: |
        .items |= map(
          if .metadata.kind != "image"
            # The raw OCR text has no Bengali digit (U+09E6-U+09EF).
            and (.text | test("[\u09e6-\u09ef]") | not)
            # The model's text has a Bengali digit.
            and (.metadata.verified.markdown | test("[\u09e6-\u09ef]"))
          then
            .metadata.verified.markdown |= (explode | map(if . >= 2534 and . <= 2543 then . - 2486 else . end) | implode)
          else . end
        )

  - agent: extract
    description: "Confirm grade, subject, language, and board from the book itself"
    config:
      foreach: '[.items[] | select(.metadata.kind != "image" and .metadata.page <= 6) | .metadata.verified.markdown // empty] | {text: join("\n\n")}'
      input: ".text"
      path: ".metadata.book"
      retries: 3
      prompt: |
        You read the front matter of a school textbook.
        Report the grade, subject, medium of instruction, issuing board, and title
        exactly as printed.
        Use the printed text only. Never infer a value from a syllabus you recognise.
        Set a field to null when the front matter does not print it.
      schema:
        type: object
        properties:
          grade: {type: ["string", "null"]}
          subject: {type: ["string", "null"]}
          language: {type: ["string", "null"]}
          board: {type: ["string", "null"]}
          title: {type: ["string", "null"]}
          evidence: {type: string, description: "The printed line each value came from"}
        required: [grade, subject, language, board, title, evidence]

  - agent: safe_extract
    description: "Write alt text and a long description for every figure"
    config:
      foreach: '(.metadata.book.language // "") as $lang | .items[] | select(.metadata.kind == "image") | . + {book_language: $lang}'
      input: "[.id]"
      context: '"Book language: " + (if .book_language == "" then "unknown" else .book_language end)'
      path: ".metadata.accessibility"
      model: ${.config.verify_model}
      concurrency: ${.config.page_concurrency}
      retries: 3
      prompt: |
        You produce alt text and structured descriptions for a school textbook figure, for a blind student.

        Rules:
        1. Base labels and captions directly on the visible image. Never name an object, chemical,
           apparatus, or scene that the image does not show. If the image is plain shapes, empty
           outlines, or a caption label, describe exactly that. A guess is worse than a plain
           description, because a blind student will trust it as fact.
        2. Report the observable result, not only the apparatus. Name every colour change, flame, precipitate, bubble, deposit, glow, and relative volume.
        3. Keep every scientific qualifier exact. Dilute is not concentrated. A solid is not a solution.
        4. Mark a figure decorative only when it carries no teaching content, such as a border, rule, QR code, barcode, or a small pictogram beside a heading (a notebook, pencil, or bulb icon). Set kind to decorative with empty alt_text.
        5. When the crop holds only printed caption text and no drawing, set kind to decorative
           with empty alt_text and set review_needed, with review_reason "caption-only crop".
        6. Describe only this one image. Never describe what is not visible in it.
        7. A government seal, state emblem, publisher logo, or motto is not decorative. Set kind to
           logo. Write the organization name, then the words printed in the image, copied exactly.
           Never write a placeholder such as "[LOGO]".
           When the print is too faint to read, write only the organization name and set review_needed.

        8. Never identify a series, region, or part by colour alone. Pair every colour with its
           label, pattern, or place, for example "red bars: sales in 2020". Copy the figure's own
           key into long_description. For a chart or graph, write every value, axis label, and
           unit that the figure shows into long_description, so the data does not depend on the
           colours. Keep a colour that is itself the observed result.
        9. Copy any words printed inside the figure exactly into long_description.

        Write alt_text and long_description in the book language given with this request. When it is
        unknown, use the language of the text printed in the figure.
        alt_text is one sentence under 150 characters.
        long_description holds the full reading, including the result.
      schema:
        type: object
        properties:
          kind:
            type: string
            enum: [figure, diagram, chart, table_image, logo, decorative]
          alt_text: {type: string}
          long_description: {type: string}
          visible_labels:
            type: array
            items:
              type: object
              properties:
                label: {type: string}
                gloss: {type: string}
                points_at: {type: string}
              required: [label, gloss, points_at]
          observed_result:
            type: string
            description: "The visual outcome the figure teaches. Empty for a decorative image"
          confidence: {type: number, minimum: 0, maximum: 1}
          review_needed: {type: boolean}
          review_reason: {type: string}
        required: [kind, alt_text, long_description, visible_labels, observed_result, confidence, review_needed, review_reason]
      assertions:
        - expr: '.kind == "decorative" or (.alt_text | length) > 0'
          feedback: "alt_text is empty. Write one sentence, or set kind to decorative."
        - expr: '[.alt_text, .long_description, .observed_result] + [.visible_labels[]? | .label, .gloss, .points_at] | join("") | test("[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]") | not'
          feedback: "You wrote control characters instead of readable symbols. Write any math and symbols as Unicode, such as 90° or △ABC, never as control bytes."

  - agent: safe_extract
    description: "Rebuild the page as an accessible block tree"
    config:
      foreach: '.items[] | select(.metadata.kind != "image")'
      input: "[.id]"
      context: '.metadata.verified.markdown // ""'
      path: ".metadata.remediation"
      model: ${.config.verify_model}
      concurrency: ${.config.page_concurrency}
      retries: 3
      prompt: |
        You are given one page of a scanned textbook as an image, and the raw OCR
        Markdown for that same page as reference text. Return an ordered block
        tree for the page.

        The image is the truth. When the OCR text disagrees with the image,
        follow the image and record the fix in ocr_corrections.

        When the page image is not attached, the reference Markdown is your only
        source: never add a sentence it does not contain. When it holds only
        <image .../> markers and no text, return only figure blocks for those
        markers and no text blocks.

        Transcribe only what the image actually shows. Never invent a subject,
        chapter, or passage the image does not contain. A cover page, title
        page, or a page that is mostly a logo or a picture is valid input:
        return its real, short content (title, class, publisher, seal text) as
        heading and paragraph blocks. A short or nearly blank result is
        correct for such a page. Inventing a longer, unrelated page is worse
        than a short true one, and is the one failure this rule exists to stop.

        Remove, and record in removed_artifacts:
        - printed page numbers, including Roman numeral page numbers
          (never read a Roman numeral such as "ii" as the digits "11")
        - a page number joined to a book or subject name, such as "2 विज्ञान"
          or "4 गणित मंजरी | कक्षा 9 | भाग 1"
        - running headers and running footers
        - chapter codes such as "0920CH01" or "1065CH01", print-run lines such as
          "Reprint 2026-27", and print-file markers that end in ".indd" with a page
          number and a print timestamp, even when OCR corrupted them
        - file slugs such as "Vigyan X/1"
        - QR codes, QR captions, and short-link text
        - hyperlinks and bare URLs, keeping the visible words
        - print registration marks and stray single characters

        Keep, and never merge away:
        - the chapter and section hierarchy, as heading blocks with a level
        - a bilingual heading exactly as printed, in one heading block, with both
          scripts in the order the book prints them
        - paragraph and list boundaries
        - each list entry the page prints on its own line, as its own entry
        - the full printed words of every list entry and every question, word for word.
          Never summarise, shorten, or describe an entry. "Statement about X" is wrong.
        - a question stem that comes before answer options. Write the stem in the list
          block's text field and each option in items. A list block's text field holds
          only printed words. Never write a title, label, or description of the list
          there. Leave text empty when no printed lead-in line exists.
        - a footnote, as a note block
        - a printed figure reference, as a figure_ref block

        Fix these OCR faults:
        - Markdown syntax that leaked into running text. Never leave #, ##, **,
          _, ^, $, $$, or a backslash command inside a text field. Heading depth
          belongs in the level field, not in a # character. A short inline symbol
          inside a sentence, such as a triangle, angle, or degree mark, stays in
          the text field as a plain Unicode character, for example △ABC ≅ △PQR,
          ∠ACP + ∠BCP = 180°, or x². Never write it as LaTeX, and never use _, ^,
          or $ to build it. A display equation on its own line still goes in a
          math block, not in text.
        - A digit read as a letter, and a letter read as a digit. 0 K is a
          temperature. OK is not.
        - A wrong or missing vowel sign, anusvara, nukta, or reph. Read the
          image again before you correct one. Flag the block when the print is
          too faint to settle it.
        - A fraction turned into a digit or into a native numeral. 1/2 is a
          fraction.
        - A word split at a line break. Join it.
        - Two formulas or two equations merged into one string. Split them.
        - Text in a script the book does not use. That is an OCR hallucination.
          Read it off the image or drop it and flag the block.

        Convert every equation, unit, and chemical formula into a math block:
        - Put MathML 3 in the mathml field and a plain reading in the spoken
          field. A screen reader gets the spoken field.
        - Never emit LaTeX, a raw underscore, or a raw caret in any text field.
          A short inline symbol as plain Unicode, as described above, is not LaTeX.
        - Restore a subscript, superscript, charge, or group that the OCR dropped
          only when the image shows it, for example lead nitrate is Pb(NO3)2.
        - Write a unit as a proper unit. kg m/s is momentum. kg km/s is not.

        MathML rules. Break one of these and a screen reader reads the formula
        wrong, which is the whole failure this pipeline exists to stop.
        - Every subscript goes inside <msub> and every superscript inside <msup>.
          A digit that belongs to a formula must never sit as a bare <mn> after
          an element symbol.
          Right: <mi>Zn</mi><mi>S</mi><msub><mi>O</mi><mn>4</mn></msub>
          Wrong: <mi>ZnSO</mi><mn>4</mn>
          Wrong: <msub><mi>H</mi><mn>2</mn></msub><mi>SO</mi><mn>4</mn>
          The second wrong form subscripts the 2 and then leaves the 4 on the
          baseline, so the reader says "Z n S O four".
        - An ionic charge is <msup>, for example
          <msub><mi>SO</mi><mn>4</mn></msub><msup><mrow/><mrow><mn>2</mn><mo>-</mo></mrow></msup>.
        - A word is <mtext>, never <mi>. <mi> is only for a single-letter
          variable or a chemical element symbol.
          Right: <mtext>मैग्नीशियम</mtext>
          Wrong: <mi>मैग्नीशियम</mi>
        - An equation number is not part of the mathematics. Put it in the
          block's text field, not inside the mathml. Never wrap it in <mo>,
          which marks an operator.
        - Write spoken wholly in the language named in the language field. Do
          not mix English operator words into a Hindi or Tamil reading.
          Wrong: "जिंक plus सल्फ्यूरिक अम्ल yields जिंक सल्फेट"
          Right: "जिंक धन सल्फ्यूरिक अम्ल से बनता है जिंक सल्फेट"

        Write for a student who cannot see the page. The print uses colour,
        position, and pointing words that a blind reader cannot follow. Keep every
        fact, and add what the eye would have told the reader:
        - A colour that only points at something, such as "the red line", "the
          green region", or "shaded in blue", gets the thing it points at, taken
          from the image or from the page's own key. Keep the colour word in
          brackets. Right: "the curve labelled B (drawn in red)". Wrong: "the red curve".
        - A colour that is itself the fact stays as written, for example blue
          litmus turns red, a flag colour, or red blood cells. Never delete a
          colour word.
        - A colour key or legend stays as text, with each colour next to its
          meaning in the same entry.
        - A position word that points at a picture, such as "above", "below", "on
          the right", "alongside", or "here", becomes the printed figure, table,
          or step name, for example "Figure 10.2". When the page prints no such name,
          keep the position word and set review_needed with review_reason "colour or
          position reference".
        - A fill-in-the-blank line, a run of underscores or dots where the student
          writes an answer, is read as nothing or as "underscore". Write the word for
          "blank" in the book's language in its place, once for each blank, for
          example "3 + 4 = blank". Never leave a raw underscore.
        - Never invent what a colour or position stands for. When the image and the
          page text do not settle it, keep the printed words and set review_needed
          with review_reason "colour or position reference".

        Convert every table into a table block with a header row and body rows.
        A table whose cells came back empty is data loss. Set review_needed on
        that block and say the cells were unreadable. Never return an empty table
        as if it were complete.

        Replace every <image id="..."/> marker with a figure block that carries
        the same id, in the reading position the marker sat in. Every marker in
        the reference text gets exactly one figure block.

        Set the page confidence. Set review_needed on any block you are unsure
        of. The VE team reads those flags first.
      schema:
        type: object
        properties:
          blocks:
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  enum: [heading, paragraph, list, table, math, figure, figure_ref, caption, note, activity]
                level: {type: ["integer", "null"], minimum: 1, maximum: 6}
                text: {type: string}
                items: {type: array, items: {type: string}}
                header: {type: array, items: {type: string}}
                rows: {type: array, items: {type: array, items: {type: string}}}
                mathml: {type: string}
                spoken: {type: string}
                image_id: {type: string}
                review_needed: {type: boolean}
                review_reason: {type: string}
              required: [type, text, review_needed, review_reason]
          removed_artifacts:
            type: array
            items:
              type: object
              properties:
                kind:
                  type: string
                  enum: [page_number, roman_numeral, header, footer, qr_code, hyperlink, mark, other]
                value: {type: string}
              required: [kind, value]
          ocr_corrections:
            type: array
            items:
              type: object
              properties:
                found: {type: string}
                corrected: {type: string}
                reason: {type: string}
                certain: {type: boolean}
              required: [found, corrected, reason, certain]
          language: {type: string}
          confidence: {type: number, minimum: 0, maximum: 1}
          review_needed: {type: boolean}
        required: [blocks, removed_artifacts, ocr_corrections, language, confidence, review_needed]
      assertions:
        - expr: '[.blocks[].text] | join(" ") | test("##|\\*\\*|\\\\begin\\{|\\$\\$") | not'
          feedback: "A text field still holds Markdown syntax, raw LaTeX, or a $$ math delimiter. Move any equation into a math block's mathml/spoken fields instead, and strip the markup from text."
        - expr: '[.blocks[] | select(.type == "math") | select((.mathml // "" | length) == 0 or (.spoken // "" | length) == 0)] | length == 0'
          feedback: "Every math block needs both mathml and spoken."
        - expr: '[.blocks[] | select(.type == "table") | select((.rows // [] | length) == 0 and (.review_needed | not))] | length == 0'
          feedback: "A table came back with no rows and no review flag. Extract the cells, or flag the table as unreadable."
        - expr: '[.blocks[] | select(.type == "figure") | select((.image_id // "" | length) == 0)] | length == 0'
          feedback: "A figure block lost its image id. Copy the id from the <image id=\"...\"/> marker."
        - expr: '[.blocks[].text] | join("") | test("[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]") | not'
          feedback: "A text field holds control characters, not readable symbols. Remove them, and write any inline math as plain Unicode, such as △ABC or 180°, never as control bytes."

  - agent: transform
    description: "Fix known markdown faults in the rebuilt block tree"
    config:
      update: [items]
      value: |
        def digits_to_sub: explode | map(if . >= 48 and . <= 57 then . + 8272 elif . == 43 then 8330 elif . == 45 then 8331 else . end) | implode;
        # Drop a literal bullet after a list marker, and turn a raw _{3} subscript into a Unicode subscript.
        def clean: gsub("(?<m>^[ \\t]*(?:[0-9\u09e6-\u09ef]+[.)]|[-*]))[ \\t]*\u2022[ \\t]*"; "\(.m) ") | gsub("_\\{(?<d>[0-9+-]+)\\}"; .d | digits_to_sub);
        # Drop a leading list number when a second one follows, so "1. 6." becomes "6.".
        def dedupe: sub("\\A[0-9০-৯]{1,3}[.)][ \\t]+(?<n>[0-9০-৯]{1,3}[.)])(?<r>[ \\t]|$)"; "\(.n)\(.r)");
        def fix_block:
          .text |= clean
          | (if (.items | type) == "array" then .items |= map(clean | dedupe) else . end)
          | (if .type == "paragraph" or .type == "activity" then .text |= dedupe else . end);
        .items |= map(
          if (.metadata.remediation.blocks | type) == "array" then
            .metadata.remediation.blocks |= (
              # Drop a paragraph whose whole text is one digit or a single question mark.
              map(select(((.type == "paragraph") and (.text | test("^\\s*([0-9\u09e6-\u09ef]|\\?)\\s*$"))) | not))
              | map(select(((.type == "list") and all((.items // [])[]; . == "")) | not))
              | map(fix_block)
            )
          else . end
        )

  - agent: transform
    description: "Build the VE review report"
    config:
      value: |
        .metadata.remediation_report = {
          detected_book: .metadata.book,
          pages: ([.items[] | select(.metadata.remediation != null)] | length),
          ocr_verification: {
            pages_verified: ([.items[] | select(.metadata.verified != null)] | length),
            pages_flagged: ([.items[] | select(.metadata.verified.review_needed == true)] | length),
            mean_confidence: (
              [.items[] | .metadata.verified.confidence // empty]
              | if length == 0 then null else (add / length) end
            ),
            corrections: ([.items[] | (.metadata.verified.corrections // [])[]] | length),
            corrections_by_fault: (
              [.items[] | (.metadata.verified.corrections // [])[] | .fault]
              | group_by(.) | map({key: .[0], value: length}) | from_entries
            ),
            uncertain: [
              .items[]
              | (.metadata.verified.corrections // [])[]
              | select(.certain == false)
            ]
          },
          pages_flagged: ([.items[] | select(.metadata.remediation.review_needed == true)] | length),
          mean_page_confidence: (
            [.items[] | .metadata.remediation.confidence // empty]
            | if length == 0 then null else (add / length) end
          ),
          figures: ([.items[] | select(.metadata.kind == "image")] | length),
          figures_flagged: ([.items[] | select(.metadata.accessibility.review_needed == true)] | length),
          figures_decorative: ([.items[] | select(.metadata.accessibility.kind == "decorative")] | length),
          artifacts_removed: (
            [.items[] | (.metadata.remediation.removed_artifacts // [])[] | .kind]
            | group_by(.) | map({key: .[0], value: length}) | from_entries
          ),
          uncertain_corrections: [
            .items[]
            | (.metadata.remediation.ocr_corrections // [])[]
            | select(.certain == false)
          ],
          review_queue: [
            .items[]
            | select(.metadata.remediation != null)
            | {
                page: .metadata.page,
                reasons: [.metadata.remediation.blocks[] | select(.review_needed) | .review_reason]
              }
            | select((.reasons | length) > 0)
          ]
        }

  - agent: lineage
    description: "Record the run for audit"

  - agent: detach_content
    description: "Move image bytes to disk and clear the resource content before the context is dumped to JSON"
